<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Substation</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root{--blue:#3478bb;--blue-d:#27598c;--teal:#4aa0b5;--green:#54a854;--green-d:#3f8a3f;--yellow:#ffff33;--line:#d5dde6;--bg:#f4f7fa;--ink:#1d2733;--muted:#5d6b7a;--bad:#b3261e}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:Cambria,"Palatino Linotype",Georgia,serif;font-size:12pt;color:var(--ink);background:#fff;line-height:1.45}
input,select,textarea,button{font-family:inherit;font-size:12pt}
header{background:var(--blue);color:#fff;position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:16px;padding:6px 24px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:14px;text-decoration:none;color:#fff;margin-right:auto}
.brand img{height:46px;width:auto;display:block;background:#fff}
.brand span{font-size:20pt;letter-spacing:.5px;text-transform:uppercase}
nav{display:flex;gap:4px;flex-wrap:wrap}
nav .item{position:relative}
nav .top{background:none;border:0;color:#fff;padding:14px 14px;cursor:pointer;border-bottom:4px solid transparent;text-decoration:none;display:inline-block}
nav .top:hover,nav .top.on{border-bottom-color:#fff}
.menu{display:none;position:absolute;right:0;top:100%;background:#fff;min-width:210px;box-shadow:0 6px 18px rgba(0,0,0,.22);border-radius:0 0 6px 6px;overflow:hidden}
.item.open .menu{display:block}
.menu a{display:block;padding:10px 16px;color:var(--ink);text-decoration:none;border-bottom:1px solid #eef2f6}
.menu a:hover{background:#e9f1fa}
main{max-width:1100px;margin:0 auto;padding:28px 20px 60px}
h1{font-size:19pt;margin:0 0 4px;color:var(--blue-d)}
h2{font-size:14pt;margin:22px 0 8px;color:var(--blue-d)}
p.sub{margin:0 0 18px;color:var(--muted)}
.bar{background:var(--teal);color:#fff;font-weight:bold;border-radius:5px;padding:7px 10px;display:flex;gap:30px;align-items:center;flex-wrap:wrap;margin-bottom:18px}
.bar input{width:auto !important;padding:3px 8px;border:1px solid #fff;border-radius:5px}
.gt{width:100%;border-collapse:collapse;background:var(--green);color:#fff;border-radius:5px;overflow:hidden;margin-bottom:16px;font-weight:bold}
.gt td,.gt th{padding:5px 8px;text-align:center;border-top:1px solid #dcefdc}
.gt .t{text-align:left;border-top:0}.gt .t b{color:var(--yellow)}
.gt th{color:var(--yellow)}
.card{border:1px solid var(--line);border-radius:8px;padding:18px;background:#fff;margin-bottom:18px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px 16px}
label{display:block;font-size:11pt;color:var(--muted);margin-bottom:2px}
input[type=text],input[type=email],input[type=date],input[type=number],input[type=month],select,textarea{width:100%;padding:7px 9px;border:1px solid #b9c5d1;border-radius:5px;background:#fff;color:var(--ink)}
textarea{min-height:80px;resize:vertical}
.btn{background:var(--blue);color:#fff;border:0;border-radius:5px;padding:8px 18px;cursor:pointer}
.btn:hover{background:var(--blue-d)}
.btn.alt{background:#fff;color:var(--blue-d);border:1px solid var(--blue)}
.btn.del{background:none;color:var(--bad);border:0;padding:2px 8px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:14px}
.tabs{display:flex;gap:2px;flex-wrap:wrap;border-bottom:2px solid var(--blue);margin:16px 0}
.tabs button{background:#e6eef7;border:0;padding:9px 16px;cursor:pointer;border-radius:6px 6px 0 0;color:var(--blue-d)}
.tabs button.on{background:var(--blue);color:#fff}
.tabs.small{border-bottom:1px solid var(--line)}
.tabs.small button{padding:6px 12px;font-size:11pt}
.tabs.small button.on{background:var(--green);color:#fff}
.tbl{width:100%;border-collapse:collapse;margin-top:14px;font-size:11pt}
.tbl th{background:var(--green);color:#fff;text-align:left;padding:6px 8px}
.tbl td{padding:5px 8px;border-bottom:1px solid var(--line)}
.tbl input[type=number]{width:90px;padding:3px 6px}
.scroll{overflow-x:auto}
.empty{color:var(--muted);font-style:italic;padding:10px 0}
.msg{padding:10px 12px;border-radius:5px;margin-top:12px}
.msg.ok{background:#e6f4e6;border:1px solid #9fcf9f}
.msg.bad{background:#fdecea;border:1px solid #e3a09b;color:var(--bad)}
.msg.info{background:#eaf3fb;border:1px solid #a9c8e6}
.sigprev{max-width:340px;max-height:140px;border:1px dashed #9aa9b8;background:#fff;display:block;margin-top:10px}
canvas.pad{border:1px solid #9aa9b8;border-radius:5px;background:#fff;touch-action:none;width:100%;max-width:520px;height:170px}
.ros td,.ros th{padding:2px 3px;text-align:center;font-size:10pt;min-width:34px}
.ros td:first-child,.ros th:first-child{text-align:left;min-width:130px;position:sticky;left:0;background:#fff}
.ros th:first-child{background:var(--green)}
.ros select{width:auto;padding:1px;font-size:10pt}
.ros .wk{background:#f1f5f9}
footer{text-align:center;color:var(--muted);font-size:10.5pt;padding:20px}
@media(max-width:700px){header{padding:6px 12px}.brand span{font-size:15pt}nav .top{padding:10px 8px}}
</style>
</head>

<main id="app"></main>
<div id="status" style="position:fixed;right:12px;bottom:10px;background:#27598c;color:#fff;padding:4px 12px;border-radius:14px;font-size:10.5pt;z-index:60"></div>
<footer>Substation &middot; Bhutan Power Corporation Limited</footer>

<script>
/* ---------- storage (safe) ---------- */
const KEY='substationSite.v1';
let mem=null;
function load(){try{const r=localStorage.getItem(KEY);if(r)return JSON.parse(r)}catch(e){}return mem}
/* ---- shared mode: paste the Apps Script web-app URL and token here (see Code.gs) ---- */
const CONFIG={API:'',TOKEN:''};
const online=()=>!!CONFIG.API;
async function api(action,p={}){
  const r=await fetch(CONFIG.API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({token:CONFIG.TOKEN,action,...p})});
  const j=await r.json();if(!j.ok)throw new Error(j.error||'Server error');return j}
let curSub='lobesa';const SK=()=>'sub.'+curSub;
function getKey(k){if(k==='roster')return S.roster;if(k==='staff')return S.staff;const c=JSON.parse(JSON.stringify(S.sub[k.slice(4)]));if(c.sld&&c.sld.data)c.sld=null;return c}
function setKey(k,v){if(k==='roster')S.roster=v;else if(k==='staff')S.staff=v;else S.sub[k.slice(4)]=v}
function setStatus(t,bad){const s=document.getElementById('status');if(!s)return;s.textContent=t;s.style.background=bad?'#b3261e':'#27598c'}
const dirty=new Set();let pushT=null;
async function flush(){for(const k of [...dirty]){dirty.delete(k);try{setStatus('Saving…');await api('put',{key:k,value:getKey(k)});setStatus('Saved to shared sheet')}catch(e){dirty.add(k);setStatus('Not saved: '+e.message,true)}}}
async function pull(){const r=await api('getAll');Object.entries(r.data).forEach(([k,v])=>{if(SHARED_OK.includes(k))setKey(k,v)})}
const SHARED_OK=['sub.lobesa','sub.gewathang','roster','staff'];
function save(...keys){
  try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){mem=JSON.parse(JSON.stringify(S))}
  if(online()&&keys.length){keys.forEach(k=>dirty.add(k));clearTimeout(pushT);pushT=setTimeout(flush,700)}}
const T3=['66kV Dochula-Lobeysa line','66kV Gewathang Lobesa line','66kV Basochhu-Gewathang line'];
function tl(n){return {cat:'T',name:n,volt:'66kV',km:''}}
function dl(v,n){return {cat:'D',name:v+' '+n,volt:v,km:''}}
function freshSub(trans){return{sld:null,maint:[],eq:{transformer:[],ct:[],pt:[],la:[],iso:[]},ops:[],
  lines:[...trans.map(tl),dl('33kV','Thinleygang'),dl('33kV','Wangdue'),dl('33kV','Punakha'),dl('11kV','Punakha'),dl('11kV','Wangdue')]}}
let S=load()||{sub:{lobesa:freshSub(T3),gewathang:freshSub([T3[1],T3[2]])},sig:null,roster:{},staff:{lobesa:[],gewathang:[]},lastLeave:null};
const SUBS={lobesa:'Lobesa Substation',gewathang:'Gewathang Substation'};

/* ---------- helpers ---------- */
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtDate=d=>d?new Date(d+'T00:00:00').toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'}):'';
const todayISO=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const tabState={sub:'sld',eq:'transformer',lineMode:'T',dv:'33kV'};
let route='home';

/* ---------- navigation ---------- */
const NAV=[
 {t:'Home',r:'home'},
 {t:'Staff Details',kids:[['Leave','leave'],['Signature','signature'],['Duty roster','roster']]},
 {t:'Substation',kids:[['Lobesa Substation','lobesa'],['Gewathang Substation','gewathang']]},
 {t:'Admin',r:'admin'}
];
function drawNav(){
  $('#nav').innerHTML=NAV.map((n,i)=>{
    if(!n.kids)return `<div class="item"><a class="top ${route===n.r?'on':''}" href="#${n.r}">${n.t}</a></div>`;
    const on=n.kids.some(k=>k[1]===route);
    return `<div class="item" data-i="${i}"><button class="top ${on?'on':''}" data-toggle>${n.t} &#9662;</button><div class="menu">${n.kids.map(k=>`<a href="#${k[1]}">${k[0]}</a>`).join('')}</div></div>`}).join('');
}
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-toggle]');
  document.querySelectorAll('.item.open').forEach(i=>{if(!t||i!==t.parentElement)i.classList.remove('open')});
  if(t)t.parentElement.classList.toggle('open');
});
async function go(){route=(location.hash||'#home').slice(1);if(!PAGES[route])route='home';drawNav();
  if(online()&&!['leave','signature','admin'].includes(route)){try{await flush();await pull()}catch(e){setStatus('Could not load shared data: '+e.message,true)}}
  PAGES[route]();window.scrollTo(0,0)}
window.addEventListener('hashchange',go);

/* ---------- HOME ---------- */
let homeDate=todayISO();
const OPTYPES=['Planned','Ad-Hoc','Emergency','Fault','Changeover'];
const OPCATS=[['Transmission Line','Transmission Line'],['Distribution Line','Distribution Line'],['Substation Equipment','Substation Equipment']];
function allOps(){return Object.values(S.sub).flatMap(s=>s.ops)}
function home(){
  const ops=allOps().filter(o=>o.date===homeDate);
  const dn=new Date(homeDate+'T00:00:00').toDateString();
  const isToday=homeDate===todayISO();
  const tbl=([label,cat])=>{
    const m=ops.filter(o=>o.cat===cat),c=ty=>m.filter(o=>o.type===ty).length,f=n=>n?n+(n>1?' Times':' Time'):'None';
    return `<table class="gt"><tr><td class="t" colspan="6"><b>${label}:</b> &nbsp;${f(m.length)}</td></tr>
      <tr>${OPTYPES.map(x=>`<th>${x}</th>`).join('')}<th>Total</th></tr>
      <tr>${OPTYPES.map(x=>`<td>${f(c(x))}</td>`).join('')}<td>${f(m.length)}</td></tr></table>`};
  $('#app').innerHTML=`<div class="bar"><span>Outage Statistics for ${isToday?'Today ':''}(${esc(dn)})</span><span>or Select date to view outage statistics:</span><input type="date" id="hd" value="${homeDate}"></div>
   ${OPCATS.map(tbl).join('')}
   <p class="sub">Figures are counted from the entries logged under <b>Substation &rarr; Operation</b>.</p>`;
  $('#hd').onchange=e=>{homeDate=e.target.value||todayISO();home()};
}

/* ---------- LEAVE ---------- */
const LEAVE_TYPES=['Casual Leave','Earned Leave','Sick Leave','Maternity Leave','Paternity Leave','Extraordinary Leave','Other'];
function leaveDays(a,b){if(!a||!b)return 0;const d=(new Date(b)-new Date(a))/864e5+1;return d>0?Math.round(d):0}
function leavePage(){
  const L=S.lastLeave;
  $('#app').innerHTML=`<h1>Leave</h1><p class="sub">Staff Details &rarr; Leave. Enter the details; a PDF is generated and prepared for the employee's mail.</p>
  <form class="card" id="lf"><div class="grid">
   <div><label>Employee name</label><input type="text" name="name" required></div>
   <div><label>Employee ID</label><input type="text" name="eid" required></div>
   <div><label>Designation</label><input type="text" name="desig" required></div>
   <div><label>Employee email</label><input type="email" name="email" required></div>
   <div><label>Leave type</label><select name="type">${LEAVE_TYPES.map(t=>`<option>${t}</option>`).join('')}</select></div>
   <div><label>From</label><input type="date" name="from" required></div>
   <div><label>To</label><input type="date" name="to" required></div>
   <div><label>No. of days</label><input type="text" name="days" readonly value="0"></div>
  </div>
  <div style="margin-top:12px"><label>Reason</label><textarea name="reason" required></textarea></div>
  <div class="row"><button class="btn" type="submit">Generate PDF</button><span id="sigstate" style="color:var(--muted)"></span></div></form>
  <div id="lout">${L?leaveOut(L):''}</div>`;
  const f=$('#lf');
  const upd=()=>{f.days.value=leaveDays(f.from.value,f.to.value)};
  f.from.onchange=f.to.onchange=upd;
  $('#sigstate').textContent=S.sig?'Your saved signature will be placed on the PDF.':'No signature saved yet (Staff Details → Signature).';
  f.onsubmit=async e=>{e.preventDefault();
    const d=Object.fromEntries(new FormData(f));d.days=leaveDays(d.from,d.to);
    if(d.days<1){$('#lout').innerHTML='<div class="msg bad">"To" date must be on or after "From" date.</div>';return}
    d.created=new Date().toISOString();
    try{
      if(online()){$('#lout').innerHTML='<div class="msg info">Creating PDF and sending email…</div>';
        const r=await api('leave',{d:{name:d.name,eid:d.eid,desig:d.desig,email:d.email,type:d.type,from:d.from,to:d.to,days:d.days,reason:d.reason},sig:S.sig});
        d.pdf='data:application/pdf;base64,'+r.pdf;d.emailed=r.emailed;d.drive=r.url;d.mailErr=r.mailErr}
      else d.pdf=makeLeavePdf(d)
    }catch(err){$('#lout').innerHTML='<div class="msg bad">Could not create the leave PDF: '+esc(err.message)+'</div>';return}
    S.lastLeave=d;try{save()}catch(e){};$('#lout').innerHTML=leaveOut(d);wireLeaveOut(d)};
  if(L)wireLeaveOut(L);
}
function makeLeavePdf(d){
  const {jsPDF}=window.jspdf;const doc=new jsPDF({unit:'mm',format:'a4'});
  doc.setFont('times','bold');doc.setFontSize(16);doc.text('Bhutan Power Corporation Limited',105,20,{align:'center'});
  doc.setFontSize(13);doc.text('Leave Application',105,28,{align:'center'});
  doc.setDrawColor(52,120,187);doc.line(20,32,190,32);
  const rows=[['Employee name',d.name],['Employee ID',d.eid],['Designation',d.desig],['Email',d.email],['Leave type',d.type],['From',fmtDate(d.from)],['To',fmtDate(d.to)],['No. of days',String(d.days)]];
  let y=44;doc.setFontSize(12);
  rows.forEach(r=>{doc.setFont('times','bold');doc.text(r[0]+':',22,y);doc.setFont('times','normal');doc.text(String(r[1]),70,y);y+=9});
  doc.setFont('times','bold');doc.text('Reason:',22,y);doc.setFont('times','normal');
  const lines=doc.splitTextToSize(d.reason,115);doc.text(lines,70,y);y+=lines.length*6+14;
  if(S.sig){try{doc.addImage(S.sig,'PNG',22,y,50,20)}catch(e){}}
  doc.line(22,y+22,80,y+22);doc.text('Signature of employee',22,y+28);
  doc.setFontSize(9);doc.text('Generated '+new Date(d.created).toLocaleString('en-GB'),22,285);
  return doc.output('datauristring');
}
function leaveOut(d){
  const fn=`Leave_${d.eid}_${d.from}.pdf`;
  const sub=encodeURIComponent('Leave application - '+d.name+' ('+fmtDate(d.from)+' to '+fmtDate(d.to)+')');

/* ---------- SIGNATURE ---------- */
function analyseSignature(img,drawn){
  const W0=img.naturalWidth||img.width,H0=img.naturalHeight||img.height;
  if(!drawn&&(W0<200||H0<60))return {ok:false,why:`Image is too small (${W0}×${H0}px). Use at least 200×60 px.`};
  const sc=Math.min(1,700/W0),w=Math.round(W0*sc),h=Math.round(H0*sc);
  const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');
  x.fillStyle='#fff';x.fillRect(0,0,w,h);x.drawImage(img,0,0,w,h);
  const px=x.getImageData(0,0,w,h).data,g=new Float32Array(w*h);
  const hist=new Array(256).fill(0);
  for(let i=0;i<w*h;i++){const v=.299*px[i*4]+.587*px[i*4+1]+.114*px[i*4+2];g[i]=v;hist[v|0]++}
  let acc=0,bg=255;for(let v=0;v<256;v++){acc+=hist[v];if(acc>=w*h/2){bg=v;break}}
  const thr=bg-70;let ink=0,inkSum=0,minx=w,maxx=0,miny=h,maxy=0;
  for(let yy=0;yy<h;yy++)for(let xx=0;xx<w;xx++){const v=g[yy*w+xx];if(v<thr){ink++;inkSum+=v;if(xx<minx)minx=xx;if(xx>maxx)maxx=xx;if(yy<miny)miny=yy;if(yy>maxy)maxy=yy}}
  const ratio=ink/(w*h);
  if(ratio<0.003)return {ok:false,why:'No clear ink found. The signature is too faint or the image is blank.'};
  if(ratio>0.4)return {ok:false,why:'Image is mostly dark/noisy. Sign on plain white paper in good light.'};
  const contrast=bg-inkSum/ink;
  if(contrast<90)return {ok:false,why:'Contrast is too low. Use a dark pen on white paper.'};
  const bw=maxx-minx,bh=maxy-miny;
  if(bw<w*0.12||bh<h*0.05)return {ok:false,why:'Signature is too small within the image. Crop closer to the signature.'};
  /* sharpness: mean gradient magnitude on ink edges */
  let gs=0,gn=0;
  for(let yy=Math.max(1,miny);yy<Math.min(h-1,maxy);yy++)for(let xx=Math.max(1,minx);xx<Math.min(w-1,maxx);xx++){
    const i=yy*w+xx,gx=g[i+1]-g[i-1],gy=g[i+w]-g[i-w],m=Math.hypot(gx,gy);
    if(g[i]<thr+40&&m>20){gs+=m;gn++}}
  const edge=gn?gs/gn:0;
  if(!drawn&&edge<70)return {ok:false,why:'Image looks blurred. Retake it steadily and in focus.'};
  /* output: transparent-background PNG, cropped */
  const pad=8,cx=Math.max(0,minx-pad),cy=Math.max(0,miny-pad),cw=Math.min(w-cx,bw+pad*2),ch=Math.min(h-cy,bh+pad*2);
  const o=document.createElement('canvas');o.width=cw;o.height=ch;const ox=o.getContext('2d');
  const id=ox.createImageData(cw,ch);
  for(let yy=0;yy<ch;yy++)for(let xx=0;xx<cw;xx++){const si=((cy+yy)*w+cx+xx)*4,di=(yy*cw+xx)*4;const v=g[(cy+yy)*w+cx+xx];const a=Math.max(0,Math.min(255,(bg-v)*2.2));id.data[di]=20;id.data[di+1]=30;id.data[di+2]=60;id.data[di+3]=a}
  ox.putImageData(id,0,0);
  return {ok:true,data:o.toDataURL('image/png')};
}
function sigPage(){
  $('#app').innerHTML=`<h1>Signature</h1><p class="sub">Staff Details &rarr; Signature. Upload a photo/scan of your signature or draw it. Unclear images are rejected.</p>
  <div class="card"><h2 style="margin-top:0">Add signature</h2>
   <div class="grid"><div><label>Name</label><input type="text" id="sn" value="${esc((S.sigOwner||{}).name)}"></div><div><label>Employee ID</label><input type="text" id="si" value="${esc((S.sigOwner||{}).eid)}"></div><div><label>Email</label><input type="email" id="se" value="${esc((S.sigOwner||{}).email)}"></div></div>
   <div class="grid" style="margin-top:12px"><div><label>Upload image (PNG / JPG)</label><input type="file" id="sf" accept="image/png,image/jpeg"></div></div>
   <h2>or draw</h2><canvas class="pad" id="pad"></canvas>
   <div class="row"><button class="btn" id="usepad">Use drawing</button><button class="btn alt" id="clr">Clear</button></div>
   <div id="smsg"></div></div>
  <div class="card"><h2 style="margin-top:0">Saved signature</h2><div id="saved"></div></div>`;
  drawSaved();
  $('#sf').onchange=e=>{const f=e.target.files[0];if(!f)return;
    if(!/^image\/(png|jpeg)$/.test(f.type)){return smsg('bad','Rejected: only PNG or JPG images are accepted.')}
    const u=URL.createObjectURL(f),im=new Image();
    im.onload=()=>{URL.revokeObjectURL(u);accept(analyseSignature(im,false))};
    im.onerror=()=>smsg('bad','Rejected: the file could not be read as an image.');im.src=u};
  const cv=$('#pad');const r=cv.getBoundingClientRect();cv.width=r.width*2;cv.height=r.height*2;
  const cx=cv.getContext('2d');cx.scale(2,2);cx.lineWidth=2.2;cx.lineCap='round';cx.strokeStyle='#14213c';let dr=false;
  const pos=e=>{const b=cv.getBoundingClientRect();return [e.clientX-b.left,e.clientY-b.top]};
  cv.onpointerdown=e=>{dr=true;cv.setPointerCapture(e.pointerId);cx.beginPath();cx.moveTo(...pos(e))};
  cv.onpointermove=e=>{if(dr){cx.lineTo(...pos(e));cx.stroke()}};
  cv.onpointerup=()=>dr=false;
  $('#clr').onclick=()=>{cx.clearRect(0,0,cv.width,cv.height)};
  $('#usepad').onclick=()=>{const im=new Image();im.onload=()=>accept(analyseSignature(im,true));im.src=cv.toDataURL()};
  async function accept(res){
    if(!res.ok)return smsg('bad','Rejected: '+res.why);
    const o={name:$('#sn').value.trim(),eid:$('#si').value.trim(),email:$('#se').value.trim()};
    if(online()){
      if(!o.name||!o.eid)return smsg('bad','Please enter your name and employee ID first.');
      try{smsg('info','Saving to Drive…');await api('signature',{...o,image:res.data})}catch(err){return smsg('bad','Could not save to Drive: '+err.message)}}
    S.sigOwner=o;S.sig=res.data;save();smsg('ok','Signature accepted and saved.');drawSaved()}
}
function smsg(k,t){$('#smsg').innerHTML=`<div class="msg ${k}">${esc(t)}</div>`}
function drawSaved(){
  $('#saved').innerHTML=S.sig?`<img class="sigprev" alt="Saved signature" src="${S.sig}"><div class="row"><button class="btn alt" id="rm">Remove</button></div>
   <div class="msg info" style="margin-top:12px">${online()?'Also saved to the shared Google Drive (Signatures folder).':'Saved in this browser only (shared mode not connected).'}</div>`:'<div class="empty">No signature saved yet.</div>';
  const b=$('#rm');if(b)b.onclick=()=>{S.sig=null;save();drawSaved()};
}

const SHIFTS=[['','–'],['M','M'],['E','E'],['N','N'],['G','G'],['O','O'],['L','L']];
function rosterPage(){
  const st=window._ros||(window._ros={sub:'lobesa',month:todayISO().slice(0,7)});
  $('#app').innerHTML=`<h1>Duty roster</h1><p class="sub">Staff Details &rarr; Duty roster.</p>
  <div class="card"><div class="grid"><div><label>Substation</label><select id="rs">${Object.entries(SUBS).map(([k,v])=>`<option value="${k}" ${k===st.sub?'selected':''}>${v}</option>`).join('')}</select></div>
  <div><label>Month</label><input type="month" id="rm" value="${st.month}"></div>
  <div><label>Add staff</label><div style="display:flex;gap:6px"><input type="text" id="rn" placeholder="Name"><button class="btn" id="ra">Add</button></div></div></div>
  <p class="sub" style="margin:10px 0 0">M = Morning, E = Evening, N = Night, G = General, O = Off, L = Leave</p>
  <div class="scroll" id="rt"></div></div>`;
  const draw=()=>{
    const [y,m]=st.month.split('-').map(Number),n=new Date(y,m,0).getDate(),staff=S.staff[st.sub],key=st.sub+'|'+st.month,data=S.roster[key]||(S.roster[key]={});
    if(!staff.length){$('#rt').innerHTML='<div class="empty">No staff added for this substation yet.</div>';return}
    let h=`<table class="tbl ros"><tr><th>Staff</th>${Array.from({length:n},(_,i)=>`<th>${i+1}</th>`).join('')}<th></th></tr>`;
    staff.forEach((s,si)=>{h+=`<tr><td>${esc(s)}</td>`;
      for(let d=1;d<=n;d++){const wk=[0,6].includes(new Date(y,m-1,d).getDay());const v=(data[si]||{})[d]||'';
        h+=`<td class="${wk?'wk':''}"><select data-s="${si}" data-d="${d}">${SHIFTS.map(o=>`<option value="${o[0]}" ${o[0]===v?'selected':''}>${o[1]}</option>`).join('')}</select></td>`}
      h+=`<td><button class="btn del" data-rm="${si}" title="Remove">&times;</button></td></tr>`});
    $('#rt').innerHTML=h+'</table>';
  };
  draw();
  $('#rs').onchange=e=>{st.sub=e.target.value;draw()};
  $('#rm').onchange=e=>{st.month=e.target.value||st.month;draw()};
  $('#ra').onclick=()=>{const v=$('#rn').value.trim();if(!v)return;S.staff[st.sub].push(v);save('staff');$('#rn').value='';draw()};
  $('#rt').onchange=e=>{const s=e.target.closest('select');if(!s)return;const key=st.sub+'|'+st.month;const d=S.roster[key]||(S.roster[key]={});(d[s.dataset.s]||(d[s.dataset.s]={}))[s.dataset.d]=s.value;save('roster')};
  $('#rt').onclick=e=>{const b=e.target.closest('[data-rm]');if(!b)return;const i=+b.dataset.rm;S.staff[st.sub].splice(i,1);
    Object.keys(S.roster).filter(k=>k.startsWith(st.sub+'|')).forEach(k=>{const o=S.roster[k],n={};Object.keys(o).forEach(j=>{j=+j;if(j<i)n[j]=o[j];else if(j>i)n[j-1]=o[j]});S.roster[k]=n});save('staff','roster');draw()};
}

/* generic add/delete table */
function recordPane(el,arr,title,fields,extraHtml=''){
  el.innerHTML=`${extraHtml}<form class="card" id="rf"><h2 style="margin-top:0">Add ${esc(title)}</h2><div class="grid">${fields.map(fieldHtml).join('')}</div><div class="row"><button class="btn" type="submit">Add</button></div></form>
  <div class="scroll" id="rl"></div>`;
  const wireOthers=()=>{el.querySelectorAll('select[data-oth]').forEach(s=>{const t=s.parentElement.querySelector('.oth');s.onchange=()=>{t.style.display=s.value==='Others'?'block':'none'}})};wireOthers();
  const draw=()=>{$('#rl',el).innerHTML=arr.length?`<table class="tbl"><tr>${fields.map(f=>`<th>${esc(f[1])}</th>`).join('')}<th></th></tr>${arr.map((r,i)=>`<tr>${fields.map(f=>`<td>${esc(f[2]==='date'?fmtDate(r[f[0]]):r[f[0]])}</td>`).join('')}<td><button class="btn del" data-i="${i}">Delete</button></td></tr>`).join('')}</table>`:'<div class="empty">No records yet.</div>'};
  draw();
  $('#rf',el).onsubmit=e=>{e.preventDefault();const o={};
    for(const f of fields){const c=e.target.elements[f[0]];let v=c.value.trim();
      if(f[2]==='sel'&&v==='Others'){const t=e.target.elements[f[0]+'_o'].value.trim();if(t)v='Others: '+t}
      o[f[0]]=v}
    if(Object.values(o).every(v=>!v))return;arr.push(o);save(SK());draw();e.target.reset();wireOthers();e.target.querySelectorAll('.oth').forEach(t=>t.style.display='none')};
  $('#rl',el).onclick=e=>{const b=e.target.closest('[data-i]');if(b){arr.splice(+b.dataset.i,1);save(SK());draw()}};
}
function fieldHtml(f){
  const [k,l,t,o]=f;
  if(t==='sel')return `<div><label>${esc(l)}</label><select name="${k}" data-oth="1">${o.map(x=>`<option>${esc(x)}</option>`).join('')}</select>${o.includes('Others')?`<input class="oth" type="text" name="${k}_o" placeholder="Specify" style="display:none;margin-top:4px">`:`<input class="oth" type="hidden" name="${k}_o">`}</div>`;
  return `<div><label>${esc(l)}</label><input type="${t}" name="${k}" ${t==='number'?'step="any"':''}></div>`;
}

function sldPane(el,sb){
  el.innerHTML=`<div class="card"><h2 style="margin-top:0">Single line diagram</h2><label>Add file (PDF only)</label><input type="file" id="pf" accept="application/pdf,.pdf"><div id="pm"></div></div><div id="pv"></div>`;
  const show=()=>{$('#pv',el).innerHTML=sb.sld?`<div class="card"><b>${esc(sb.sld.name)}</b> <span style="color:var(--muted)">(${Math.round(sb.sld.size/1024)} KB, added ${esc(sb.sld.when)})</span>
   <div class="row"><a class="btn" href="${sb.sld.data||sb.sld.url}" target="_blank" rel="noopener">Open PDF</a>${sb.sld.data?`<a class="btn alt" href="${sb.sld.data}" download="${esc(sb.sld.name)}">Download</a>`:''}<button class="btn del" id="pd">Remove</button></div></div>`:'<div class="empty">No single line diagram added yet.</div>';
   const d=$('#pd',el);if(d)d.onclick=()=>{sb.sld=null;save(SK());show()}};show();
  $('#pf',el).onchange=async e=>{const f=e.target.files[0];if(!f)return;
    const head=new TextDecoder().decode(new Uint8Array(await f.slice(0,5).arrayBuffer()));
    if(!/\.pdf$/i.test(f.name)||head!=='%PDF-'){e.target.value='';$('#pm',el).innerHTML='<div class="msg bad">Rejected: only PDF files are accepted.</div>';return}
    if(f.size>8*1024*1024){e.target.value='';$('#pm',el).innerHTML='<div class="msg bad">Rejected: file is larger than 8 MB.</div>';return}
    const r=new FileReader();r.onload=async()=>{const when=new Date().toLocaleDateString('en-GB');
      try{if(online()){$('#pm',el).innerHTML='<div class="msg info">Uploading…</div>';const u=await api('sld',{sub:curSub,name:f.name,data:r.result});sb.sld={name:f.name,size:f.size,url:u.url,when}}
      else sb.sld={name:f.name,size:f.size,data:r.result,when}}catch(err){$('#pm',el).innerHTML='<div class="msg bad">Upload failed: '+esc(err.message)+'</div>';return}
      save(SK());$('#pm',el).innerHTML='<div class="msg ok">PDF added.</div>';show()};r.readAsDataURL(f)};
}

  p.onchange=e=>{const k=e.target.dataset.km;if(k!==undefined){sb.lines[k].km=e.target.value;save(SK())}};
  p.onclick=e=>{const b=e.target.closest('[data-d]');if(b){sb.lines.splice(+b.dataset.d,1);save(SK());linesPane(el,sb)}};
